name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      # Node.js from package.json's engines field.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # Reuse Next.js's build cache between runs (see node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md).
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '!node_modules/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The build doesn't need TWELVE_DATA_API_KEY: it is only read at request time.
      - run: pnpm build
